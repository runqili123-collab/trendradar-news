      url: "https://efectococuyo.com/feed"
      enabled: true
    - id: "caracas-chronicles"
      name: "Caracas Chronicles (独立分析)"
      url: "https://caracaschronicles.com/feed"
      enabled: true
    - id: "el-diario-ve"
      name: "El Diario (独立)"
      url: "https://eldiario.com/feed"
      enabled: true
    # 亲政府/官方媒体
    - id: "ultimas-noticias"
      name: "Ultimas Noticias (亲政府)"
      url: "https://ultimasnoticias.com.ve/feed"
      enabled: true
    - id: "correo-del-orinoco"
