      enabled: true
    - id: "bogota-post"
      name: "The Bogota Post (英文)"
      url: "https://thebogotapost.com/feed"
      enabled: true

    # ==================== 秘鲁 ====================
    - id: "el-comercio-pe"
      name: "El Comercio Peru (综合)"
      url: "https://elcomercio.pe/rss"
      enabled: true
    - id: "gestion-pe"
      name: "Gestion (财经)"
      url: "https://gestion.pe/rss"
      enabled: true
    - id: "la-republica-pe"
