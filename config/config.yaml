# ═══════════════════════════════════════════════════════════════
# TrendRadar 配置文件 — 长城汽车(GWM)拉美情报系统
# 覆盖: 加勒比 / 委内瑞拉 / 哥伦比亚 / 秘鲁 / 厄瓜多尔
# 推送: 钉钉机器人
# ═══════════════════════════════════════════════════════════════

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "America/Bogota"    # 哥伦比亚时区 UTC-5，覆盖大部分目标区域
  show_version_update: false

# ===============================================================
# 1.5 调度系统
# ===============================================================
schedule:
  enabled: true
  preset: "morning_evening"     # 早间+晚间各推送一次

# ===============================================================
# 2. 数据源 - 热榜平台（精简，仅保留与拉美汽车行业相关的中文源）
# ===============================================================
platforms:
  enabled: true
  sources:
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "baidu"
      name: "百度热搜"
    - id: "toutiao"
      name: "今日头条"
    - id: "thepaper"
      name: "澎湃新闻"
    - id: "weibo"
      name: "微博"
    - id: "zhihu"
      name: "知乎"
    - id: "bilibili-hot-search"
      name: "bilibili热搜"

# ===============================================================
# 3. 数据源 - RSS 订阅
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 3
  feeds:
    # ==================== 加勒比地区 ====================
    # 综合媒体
