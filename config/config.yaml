      enabled: true
    - id: "diario-correo"
      name: "Diario Correo (综合)"
      url: "https://diariocorreo.pe/rss"
      enabled: true
    - id: "andina"
      name: "Andina (官方通讯社)"
      url: "https://andina.pe/rss"
      enabled: true

    # ==================== 厄瓜多尔 ====================
    - id: "el-universo-ec"
      name: "El Universo (独立)"
      url: "https://www.eluniverso.com/rss"
      enabled: true
    - id: "el-comercio-ec"
      name: "El Comercio Ecuador (综合)"
      url: "https://www.elcomercio.com/rss"
      enabled: true
    - id: "primicias-ec"
      name: "Primicias (独立)"
      url: "https://www.primicias.ec/feed"
      enabled: true
    - id: "forbes-ecuador"
      name: "Forbes Ecuador (财经/汽车)"
      url: "https://www.forbes.com.ec/feed"
