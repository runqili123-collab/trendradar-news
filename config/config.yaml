      enabled: true
    - id: "jamaica-observer"
      name: "Jamaica Observer"
      url: "https://www.jamaicaobserver.com/feed"
      enabled: true
    - id: "trinidad-newsday"
      name: "Trinidad & Tobago Newsday"
      url: "https://newsday.co.tt/feed/"
      enabled: true
    - id: "nationnews"
      name: "Nation News Barbados"
      url: "https://nationnews.com/feed"
      enabled: true
    - id: "caribbean-news-now"
      name: "Caribbean News Now"
      url: "https://thecaribbeannewsnow.com/feed"
      enabled: true
    - id: "jamaica-star"
      name: "Jamaica Star"
      url: "https://jamaica-star.com/feed/news.xml"
      enabled: true
    - id: "caribbean-journal"
      name: "Caribbean Journal"
      url: "https://www.caribjournal.com/feed"
      enabled: true

    # ==================== 委内瑞拉 ====================
    # 独立/反对派媒体
